<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Estacionamento</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<header th:replace="~{fragments :: header('cadastro')}"></header>
<main class="pagina estreita">
    <form class="form-card flutuante form-cadastro" method="post" th:action="@{/efetuar-cadastro}">
        <h2>Cadastro de pessoas</h2>
        <div class="alerta alerta-erro" th:if="${erro}" th:text="${erro}">Erro</div>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome" th:value="${usuario?.nome}" required> <br>
        <input type="text" id="cpf" name="cpf" placeholder="Digite seu CPF" th:value="${usuario?.cpf}"> <br>
        <input type="text" id="email" name="email" placeholder="Digite seu e-mail" th:value="${usuario?.email}" required> <br>
        <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required> <br>
        <input type="text" id="telefone" name="telefone" placeholder="Digite seu telefone" th:value="${usuario?.telefone}"> <br>
        <input type="date" id="datadenasc" name="datadenasc" th:value="${usuario?.datadenasc}"> <br>
        <button type="submit">Cadastrar</button>
        <h3>Já tem cadastro? <a th:href="@{/}">Entrar</a></h3>
    </form>
</main>
</body>
</html>
